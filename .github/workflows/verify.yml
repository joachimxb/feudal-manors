# Verification, run on the published artifact itself.
#
# Every check here runs against index.html — the one file this project ships — with no packages,
# no install step and no build. That is the point: the harness must never become a dependency of
# the thing it checks, or "one self-contained file, works offline from a memory stick" stops being
# true. `npm ci` is deliberately absent because there is nothing to install.
#
# What is NOT here, and why: cmpnum / cmpnumoffice / cmprealm compare the candidate against a
# BASELINE copy of a previous build, and a baseline belongs to the release it was taken from — it
# is a local pre-release step, documented in tools/README.md, not something a workflow can invent.
# Everything that needs only the file itself runs below.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Self-tests (in-page suite, driven headless)
        run: node tools/run_selftest.mjs index.html

      # 9,600 states: both revenue profiles across the estate dials. It was half that until v3.1,
      # when the custom of record made the profile a real dimension — a sweep that ran on whichever
      # economy the page opened in had explored the whole space once, on one side of a dial. The run
      # also asserts every NAMED default-facing surface was exercised; a surface that renders nothing
      # is indistinguishable from a surface nobody scanned, and that is how the glance line went
      # unswept for a year.
      - name: Defect sweep (9,600 states, both profiles, no NaN or undefined)
        run: node tools/sweep.mjs index.html

      - name: Navigation harness (the estate survives a nav click)
        run: node tools/check_nav.mjs index.html

      # ---- the ownership gates, added in v3.1 -------------------------------------------------
      # A shared rule may have exactly one owner. These exist because the file shipped with seven
      # copies of the rural revenue rate and four of the scutage name map, two of which had drifted
      # far enough to print "(undefined)" on three of five settings. A numeric diff cannot see that
      # class: both copies agree until a dial makes them disagree.
      - name: Rule ownership (no shadow copies of a centralized rule)
        run: node tools/check_rule_owners.mjs index.html

      - name: Semantic-shadow register (identity-based, both directions)
        run: node tools/audit_semantic_shadows.mjs index.html

      - name: Badge system (kinds styled, keyed, contrast-checked, spaced, titled)
        run: node tools/audit_badges.mjs index.html

      # The module opens on the CUSTOMARY rent, so an unqualified "land+3" in prose is simply wrong
      # on load. Static markup, invisible to the sweep and to the numeric diffs — hence its own gate.
      - name: Profile prose (no profile-dependent rate stated as bare fact)
        run: node tools/audit_profile_prose.mjs index.html

      # The three audits are LISTS, not gates: they print what they find and a number that grows
      # is the finding. They are run here so the numbers are on the record for every commit.
      - name: Accessibility audit
        run: node tools/audit_a11y.mjs index.html

      - name: Contrast audit (WCAG 2.1)
        run: node tools/audit_contrast.mjs

      - name: Unit-discipline audit (bare gp)
        run: node tools/audit_units.mjs index.html
